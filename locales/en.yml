en:
  theme_metadata:
    description: "Example Discourse theme with blocks — skills reference implementation"
    settings:
      hero_banner:
        description: "Hero banner on the homepage"
        schema:
          properties:
            button_link:
              label: "Button link"
      featured_topics:
        description: "Featured topics card grid on the homepage"
        schema:
          properties:
            tag:
              label: "Tag"
              description: "Topics with this tag are featured (empty disables the block)"
            count:
              label: "Count"
      featured_list:
        description: "Topic list on the homepage"
        schema:
          properties:
            count:
              label: "Count"
            filter:
              label: "Filter"
      leaderboard:
        description: "Gamification leaderboard on the homepage"
        schema:
          properties:
            count:
              label: "Count"
      upcoming_events:
        description: "Upcoming events on the homepage"
        schema:
          properties:
            count:
              label: "Count"
      badges_ticker:
        description: "Recently earned badges on the homepage"
        schema:
          properties:
            placement:
              label: "Placement"
            count:
              label: "Count"
            badge_ids:
              label: "Badge IDs"
              description: "Only feature these badge IDs, comma-separated (empty = all enabled badges)"
            gold:
              label: "Gold badges"
            silver:
              label: "Silver badges"
            bronze:
              label: "Bronze badges"
      cta_banner:
        description: "Call-to-action banner on the homepage"
        schema:
          properties:
            link:
              label: "Button link"
      category_banner:
        description: "Banner on category pages"
        schema:
          properties:
            categories:
              label: "Categories"
              description: "Only show the banner for these categories (empty = all)"
            show_description:
              label: "Show description"
            show_logo:
              label: "Show logo"
      category_topics:
        description: "Category topics in the discovery sidebar"
        schema:
          properties:
            category:
              label: "Category"
            count:
              label: "Count"
      top_tags:
        description: "Popular tags in the discovery sidebar"
        schema:
          properties:
            count:
              label: "Count"
  hero:
    title: "Build something great together"
    subtitle: "A community for makers, thinkers, and doers. Ask questions, share ideas, and level up."
    button_label: "Get started"
  homepage:
    featured_list:
      title: "Latest discussions"
      link_text: "View all"
    featured_topics:
      title: "Featured"
      link_text: "See all featured"
    leaderboard:
      title: "Top contributors"
      button_label: "See leaderboard"
    events:
      title: "Upcoming events"
      button_label: "Details"
      link_label: "See all events"
    cta:
      title: "Ready to join the conversation?"
      description: "Create an account to ask questions, share what you know, and connect with the community."
      button_label: "Sign up now"
    badges_ticker:
      title: "Recently earned"
      button_label: "See all badges"
  category_banner:
    fallback_description: "Explore topics in this category"
  sidebar:
    home_link: "Home"
    category_topics:
      title: "Trending in category"
    top_tags:
      title: "Popular tags"
  badges_ticker:
    previous: "Scroll back"
    next: "Scroll forward"
